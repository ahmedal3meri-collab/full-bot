# UAE Services Hub — Production stack
# لا PostgreSQL ولا Redis ولا Qdrant ولا MinIO مكشوفة للإنترنت — فقط 80/443 عبر Caddy.
# راجع DEPLOYMENT.md قبل التشغيل: يجب تعبئة .env من .env.example وتوليد أسرار حقيقية.
# لم يُشغَّل هذا الملف فعليًا على أي سيرفر بعد — التزم بخطوات DEPLOYMENT.md وتحقق من كل Health Check بنفسك.

name: uae-services-hub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 2g }

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runner
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend, frontend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  realtime:
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    restart: always
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend, frontend]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - realtime
    networks: [frontend]
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
